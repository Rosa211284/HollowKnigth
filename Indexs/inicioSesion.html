<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Assets/Css/EstiloInicio.css">

    <title>Formulario para php de contacto 7w7</title>   
</head>
<body>
    
    <div class="contenedor__seccion--contacto"><!----metodologia de bemm giones-->
        <div class="contenedor__formulario--contacto">
            <h2>Bienvenido a Hallownest</h1>
                <p>Aun no tienes una cuenta?</p>
            <div class="formulario-contacto__Sesion">
                <a href="crearSesion.html">Registrarse</a>
            </div> 
            </div>

          <!----PARTE derecha-->

  
                <!----Formulario----->
                <form class="formulario-contacto">
                     <!----contenedor de los inputs----->
                     <h2>Registro</h2>
                     <hr>

                    <div class="formulario-contacto">
                        <div class="formulario-contacto__input">
                      
                            <input type="text" name="nombre" placeholder="Nombre(s)">
                            <small class="error" id="error-nombre"></small>
                        </div>
                    </div>

                     <div class="formulario-contacto">
                        <div class="formulario-contacto__input">
                           
                            <input type="text" name="contra" placeholder="Ingrese su contrasena">
                            <small class="error" id="error-contra"></small>
                        </div>
                    </div>
                <br><br>

                 <!------Boton de enviar------->
                <div class="formulario-contacto__boton">
                    <button type="submit" id="btnEnviar">Entrar</button>
                </div>
                

                <!-----Mensaje global------->

                <div class="formulario-contacto__mensaje-Global" id="MensajeGlobal"></div>

                <!----Loading-->
                <div class="formulario-contacto__loading" id="loading">
                    <div class="spinner">
                        <p>Procesando...</p>
                    </div>
                </div>
                </form>
            </div>
 
    </div>

</body>
<script type="module" src="../Assets/Js/Formulario_Contacto.js"></script>

<!---tarea fontawesome--->

</html>
